<!doctype html><html><head><meta charset="utf-8"><title>edge</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';">
<style>html,body{margin:0;height:100%;background:transparent;overflow:hidden}
#h{position:absolute;right:0;top:0;width:6px;height:100%;border-radius:4px 0 0 4px;background:rgba(14,124,123,.55);cursor:pointer}
#h:hover{background:rgba(14,124,123,.95);width:10px}</style></head>
<body><div id="h" title="edge handle"></div>
<script>document.getElementById('h').addEventListener('click', () => window.edge.activated());</script></body></html>
