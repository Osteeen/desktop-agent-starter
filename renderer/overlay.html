<!doctype html><html><head><meta charset="utf-8"><title>overlay</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src blob: data:;">
<style>
html,body{margin:0;height:100%;background:transparent;overflow:hidden;font:13px -apple-system,system-ui,sans-serif;color:#fff}
#hud{position:fixed;top:14px;right:14px;padding:6px 10px;border-radius:8px;background:rgba(20,32,43,.85);letter-spacing:.06em}
#stage{position:fixed;inset:0;display:none;background:rgba(20,32,43,.35)}
canvas{position:absolute;inset:0;width:100%;height:100%}
</style></head><body>
<div id="hud">OVERLAY SHELL · Esc closes</div>
<div id="stage"><canvas id="c"></canvas></div>
<script>
// Starter shell: proves the window mechanics (transparent, always-on-top, click-through toggle, Esc purge). No product UI here.
const stage = document.getElementById('stage'); const c = document.getElementById('c');
function size(){ c.width = innerWidth * devicePixelRatio; c.height = innerHeight * devicePixelRatio; }
addEventListener('resize', size); size();
stage.style.display = 'block';
const ctx = c.getContext('2d'); ctx.scale(devicePixelRatio, devicePixelRatio);
ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 2; ctx.strokeRect(24, 24, innerWidth - 48, innerHeight - 48);
addEventListener('keydown', (e) => { if (e.key === 'Escape') window.overlay.hide(); });
</script></body></html>
